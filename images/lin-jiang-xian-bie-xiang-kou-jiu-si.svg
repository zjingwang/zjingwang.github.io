<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5dc"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#8b4513" stroke-width="2"/>
  <rect x="30" y="30" width="740" height="540" fill="none" stroke="#d2691e" stroke-width="1"/>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="serif" font-size="32" fill="#8b4513" font-weight="bold">
    临江仙·别巷口旧肆
  </text>
  
  <!-- Poem content -->
  <text x="400" y="130" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    廿载光阴如转毂，长沟流月无声。
  </text>
  
  <text x="400" y="170" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    当年稚子伴车鸣。
  </text>
  
  <text x="400" y="210" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    不知新客面，唯忆旧时容。
  </text>
  
  <text x="400" y="250" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    欲买桂花同载酒，终难复少年情。
  </text>
  
  <text x="400" y="290" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    总有新枝接旧藤。
  </text>
  
  <text x="400" y="330" text-anchor="middle" font-family="serif" font-size="20" fill="#333">
    小园香径里，新燕又逢迎。
  </text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="5" fill="#d2691e" opacity="0.6"/>
  <circle cx="700" cy="500" r="5" fill="#d2691e" opacity="0.6"/>
  <circle cx="100" cy="500" r="3" fill="#d2691e" opacity="0.4"/>
  <circle cx="700" cy="100" r="3" fill="#d2691e" opacity="0.4"/>
  
  <!-- Author signature -->
  <text x="650" y="520" text-anchor="middle" font-family="serif" font-size="16" fill="#8b4513" font-style="italic">
    — onceking
  </text>
</svg>
