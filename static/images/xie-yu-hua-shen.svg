<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sunsetGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FF8C69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad3" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:0.6" />
    </radialGradient>
    <linearGradient id="waterGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#4682B4;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2F4F4F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 天空背景（残阳） -->
  <rect width="800" height="350" fill="url(#sunsetGrad2)"/>
  
  <!-- 夕阳（日照花神，金光处） -->
  <circle cx="650" cy="120" r="60" fill="url(#sunGrad3)" filter="url(#glow)"/>
  <circle cx="650" cy="120" r="55" fill="url(#sunsetGrad2)"/>
  
  <!-- 水面（残阳水铺） -->
  <rect x="0" y="350" width="800" height="250" fill="url(#waterGrad2)"/>
  
  <!-- 水面波纹（金光反射） -->
  <g opacity="0.4">
    <path d="M 0 400 Q 100 390 200 400 T 400 400 T 600 400 T 800 400" 
          stroke="#FFD700" stroke-width="2" fill="none"/>
    <path d="M 0 420 Q 100 410 200 420 T 400 420 T 600 420 T 800 420" 
          stroke="#FFA500" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 0 440 Q 100 430 200 440 T 400 440 T 600 440 T 800 440" 
          stroke="#FFD700" stroke-width="1" fill="none" opacity="0.5"/>
  </g>
  
  <!-- 桥（桥边驻） -->
  <g transform="translate(400, 300)" opacity="0.9">
    <!-- 桥身 -->
    <ellipse cx="0" cy="0" rx="200" ry="40" fill="#8B7355" stroke="#654321" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="200" ry="35" fill="#A0826D" opacity="0.7"/>
    <!-- 桥栏杆 -->
    <rect x="-200" y="-50" width="400" height="15" fill="#654321" rx="3"/>
    <line x1="-200" y1="-50" x2="-200" y2="-80" stroke="#654321" stroke-width="4"/>
    <line x1="200" y1="-50" x2="200" y2="-80" stroke="#654321" stroke-width="4"/>
    <line x1="-100" y1="-50" x2="-100" y2="-70" stroke="#654321" stroke-width="3"/>
    <line x1="0" y1="-50" x2="0" y2="-70" stroke="#654321" stroke-width="3"/>
    <line x1="100" y1="-50" x2="100" y2="-70" stroke="#654321" stroke-width="3"/>
    <rect x="-200" y="-80" width="400" height="10" fill="#654321"/>
  </g>
  
  <!-- 芙蓉出水（荷花） -->
  <g opacity="0.9">
    <!-- 荷花1 -->
    <ellipse cx="300" cy="320" rx="25" ry="35" fill="#FFB6C1" transform="rotate(-10 300 320)"/>
    <ellipse cx="320" cy="300" rx="20" ry="30" fill="#FFC0CB" transform="rotate(15 320 300)"/>
    <ellipse cx="290" cy="310" rx="18" ry="28" fill="#FFB6C1" transform="rotate(-25 290 310)"/>
    <circle cx="305" cy="305" r="8" fill="#FFD700"/>
    <!-- 荷叶1 -->
    <ellipse cx="280" cy="380" rx="40" ry="30" fill="#228B22" transform="rotate(-20 280 380)"/>
    <path d="M 280 380 Q 260 400 240 390" stroke="#32CD32" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- 荷花2 -->
    <ellipse cx="500" cy="330" rx="22" ry="32" fill="#FFB6C1" transform="rotate(10 500 330)"/>
    <ellipse cx="515" cy="310" rx="18" ry="28" fill="#FFC0CB" transform="rotate(-15 515 310)"/>
    <circle cx="508" cy="315" r="7" fill="#FFD700"/>
    <!-- 荷叶2 -->
    <ellipse cx="520" cy="390" rx="35" ry="28" fill="#228B22" transform="rotate(15 520 390)"/>
    <path d="M 520 390 Q 540 410 560 400" stroke="#32CD32" stroke-width="2" fill="none" opacity="0.6"/>
    
    <!-- 荷花3（远处） -->
    <ellipse cx="150" cy="340" rx="18" ry="28" fill="#FFB6C1" opacity="0.7" transform="rotate(-5 150 340)"/>
    <ellipse cx="650" cy="350" rx="20" ry="30" fill="#FFC0CB" opacity="0.7" transform="rotate(8 650 350)"/>
  </g>
  
  <!-- 风（有风轻触） -->
  <g opacity="0.3">
    <path d="M 250 300 Q 270 280 290 300 Q 310 320 330 300" 
          stroke="#E0E0E0" stroke-width="2" fill="none"/>
    <path d="M 450 320 Q 470 300 490 320 Q 510 340 530 320" 
          stroke="#E0E0E0" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 鱼（鱼浅绕湖出） -->
  <g opacity="0.8">
    <!-- 鱼1 -->
    <ellipse cx="350" cy="420" rx="15" ry="8" fill="#FF6347" transform="rotate(20 350 420)"/>
    <path d="M 365 420 Q 375 415 380 420" stroke="#FF4500" stroke-width="2" fill="none"/>
    <circle cx="345" cy="418" r="2" fill="#FFFFFF"/>
    <!-- 鱼2 -->
    <ellipse cx="450" cy="440" rx="12" ry="6" fill="#FF8C69" transform="rotate(-15 450 440)"/>
    <path d="M 438 440 Q 428 435 423 440" stroke="#FF6347" stroke-width="2" fill="none"/>
    <circle cx="447" cy="439" r="1.5" fill="#FFFFFF"/>
    <!-- 鱼3 -->
    <ellipse cx="550" cy="430" rx="10" ry="5" fill="#FFA07A" transform="rotate(25 550 430)"/>
    <circle cx="545" cy="429" r="1" fill="#FFFFFF"/>
  </g>
  
  <!-- 行人（几处行人匆乱入） -->
  <g opacity="0.6">
    <!-- 行人1（匆忙） -->
    <g transform="translate(100, 280)">
      <ellipse cx="0" cy="0" rx="8" ry="10" fill="#4A4A4A"/>
      <rect x="-6" y="0" width="12" height="25" fill="#5A5A5A" rx="2"/>
      <path d="M -6 25 Q 0 30 6 25" fill="#4A4A4A"/>
      <!-- 匆忙的姿态 -->
      <line x1="8" y1="15" x2="15" y2="10" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="8" y1="20" x2="15" y2="25" stroke="#4A4A4A" stroke-width="2"/>
    </g>
    <!-- 行人2 -->
    <g transform="translate(700, 290)">
      <ellipse cx="0" cy="0" rx="7" ry="9" fill="#4A4A4A"/>
      <rect x="-5" y="0" width="10" height="22" fill="#5A5A5A" rx="2"/>
      <line x1="5" y1="12" x2="12" y2="8" stroke="#4A4A4A" stroke-width="2"/>
      <line x1="5" y1="18" x2="12" y2="22" stroke="#4A4A4A" stroke-width="2"/>
    </g>
  </g>
  
  <!-- 凭栏的人（偷闲方寸凭栏护） -->
  <g transform="translate(400, 280)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="10" ry="12" fill="#4A4A4A"/>
    <rect x="-8" y="0" width="16" height="30" fill="#6A6A6A" rx="2"/>
    <!-- 凭栏的姿态 -->
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#654321" stroke-width="3"/>
    <ellipse cx="0" cy="-20" rx="3" ry="5" fill="#8B7355"/>
  </g>
  
  <!-- 思绪（飞思绪） -->
  <g transform="translate(400, 250)" opacity="0.5">
    <path d="M 0 0 Q 20 -30 40 -20 Q 60 -10 80 -25" 
          stroke="#FFD700" stroke-width="2" fill="none" stroke-dasharray="3,2"/>
    <path d="M 5 5 Q 25 -25 45 -15 Q 65 -5 85 -20" 
          stroke="#FFA500" stroke-width="1.5" fill="none" stroke-dasharray="2,3"/>
    <circle cx="80" cy="-25" r="4" fill="#FFD700" opacity="0.6"/>
  </g>
  
  <!-- 远树（蝉鸣传远树） -->
  <g transform="translate(50, 200)" opacity="0.7">
    <!-- 树干 -->
    <rect x="-5" y="0" width="10" height="80" fill="#654321"/>
    <!-- 树冠 -->
    <ellipse cx="0" cy="0" rx="40" ry="50" fill="#228B22" opacity="0.8"/>
    <ellipse cx="15" cy="-10" rx="25" ry="35" fill="#32CD32" opacity="0.7"/>
    <ellipse cx="-15" cy="-5" rx="30" ry="40" fill="#228B22" opacity="0.7"/>
    <!-- 蝉（简化） -->
    <ellipse cx="10" cy="-20" rx="3" ry="5" fill="#8B7355" opacity="0.8"/>
  </g>
  
  <g transform="translate(750, 180)" opacity="0.6">
    <rect x="-4" y="0" width="8" height="70" fill="#654321"/>
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="#228B22" opacity="0.7"/>
    <ellipse cx="12" cy="-8" rx="22" ry="30" fill="#32CD32" opacity="0.6"/>
  </g>
  
  <!-- 孤舟（孤舟渡） -->
  <g transform="translate(600, 420)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="35" ry="12" fill="#8B7355" stroke="#654321" stroke-width="2"/>
    <rect x="-30" y="-5" width="60" height="6" fill="#A0826D" rx="2"/>
    <!-- 船桨 -->
    <line x1="-25" y1="0" x2="-40" y2="-15" stroke="#654321" stroke-width="3"/>
    <ellipse cx="-40" cy="-15" rx="3" ry="6" fill="#8B7355"/>
    <!-- 船上的人影（简化） -->
    <ellipse cx="0" cy="-8" rx="6" ry="8" fill="#4A4A4A" opacity="0.7"/>
  </g>
  
  <!-- 归乡路（八百里，归乡路） -->
  <path d="M 0 500 Q 200 480 400 460 Q 600 440 800 420" 
        stroke="#D2B48C" stroke-width="4" fill="none" opacity="0.6"/>
  <path d="M 0 500 Q 200 480 400 460 Q 600 440 800 420" 
        stroke="#FFD700" stroke-width="2" fill="none" stroke-dasharray="8,4" opacity="0.4"/>
  
  <!-- 文字 -->
  <text x="400" y="570" font-family="serif" font-size="18" fill="#4A5568" 
        text-anchor="middle" opacity="0.8">写于花神</text>
</svg>
