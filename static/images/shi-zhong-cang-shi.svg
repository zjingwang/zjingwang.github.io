<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sunsetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF8E53;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#FFA07A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.6" />
    </radialGradient>
    <linearGradient id="desertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8956A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 夕阳天空背景 -->
  <rect width="800" height="400" fill="url(#sunsetGrad)"/>
  
  <!-- 夕阳（尚浅） -->
  <circle cx="650" cy="150" r="50" fill="url(#sunGrad2)"/>
  <circle cx="650" cy="150" r="45" fill="url(#sunsetGrad)"/>
  
  <!-- 荒原地面 -->
  <rect x="0" y="400" width="800" height="200" fill="url(#desertGrad)"/>
  
  <!-- 荒原上的起伏 -->
  <path d="M 0 400 Q 200 380 400 400 T 800 400" stroke="#C49A6A" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 0 450 Q 300 430 600 450 T 800 450" stroke="#B8956A" stroke-width="2" fill="none" opacity="0.5"/>
  
  <!-- 孤独的人影（左侧，代表"身无一伴"） -->
  <g transform="translate(200, 350)" opacity="0.7">
    <ellipse cx="0" cy="0" rx="12" ry="15" fill="#4A4A4A"/>
    <rect x="-8" y="0" width="16" height="40" fill="#5A5A5A" rx="3"/>
    <path d="M -8 40 Q 0 50 8 40" fill="#4A4A4A"/>
  </g>
  
  <!-- 思念的痕迹（散落的点，代表"留余思惦"） -->
  <g opacity="0.5">
    <circle cx="250" cy="420" r="3" fill="#FFD700"/>
    <circle cx="300" cy="440" r="2.5" fill="#FFD700"/>
    <circle cx="350" cy="430" r="3" fill="#FFD700"/>
    <circle cx="400" cy="450" r="2" fill="#FFD700"/>
    <circle cx="450" cy="420" r="2.5" fill="#FFD700"/>
  </g>
  
  <!-- 风（代表"人随风去"） -->
  <g transform="translate(500, 300)" opacity="0.4">
    <path d="M 0 0 Q 20 -15 40 0 Q 60 15 80 0" stroke="#E0E0E0" stroke-width="2" fill="none"/>
    <path d="M 10 10 Q 30 -5 50 10 Q 70 25 90 10" stroke="#E0E0E0" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 愁容（右侧，模糊的面容） -->
  <g transform="translate(600, 380)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="25" ry="30" fill="#E8D5B7" stroke="#D2B48C" stroke-width="2"/>
    <ellipse cx="-8" cy="-8" rx="3" ry="4" fill="#4A4A4A"/>
    <ellipse cx="8" cy="-8" rx="3" ry="4" fill="#4A4A4A"/>
    <path d="M -10 5 Q 0 10 10 5" stroke="#8B6F47" stroke-width="2" fill="none"/>
    <!-- 皱纹 -->
    <line x1="-12" y1="-2" x2="12" y2="-2" stroke="#C49A6A" stroke-width="1" opacity="0.6"/>
    <line x1="-10" y1="2" x2="10" y2="2" stroke="#C49A6A" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- 前行的路径（代表"定心向前"） -->
  <path d="M 200 400 Q 400 380 600 360" stroke="#FFD700" stroke-width="2" 
        fill="none" stroke-dasharray="5,3" opacity="0.6"/>
  
  <!-- 文字 -->
  <text x="400" y="570" font-family="serif" font-size="18" fill="#4A5568" 
        text-anchor="middle" opacity="0.8">诗中藏诗</text>
</svg>
