<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C8E6C9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5D6A7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sunGrad4" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FFF9C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFEB3B;stop-opacity:0.7" />
    </radialGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B9DC3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B7D9B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 春日天空 -->
  <rect width="800" height="400" fill="url(#springGrad)"/>
  
  <!-- 太阳（春日） -->
  <circle cx="150" cy="100" r="40" fill="url(#sunGrad4)"/>
  
  <!-- 山峦（虎踞龙盘） -->
  <g opacity="0.8">
    <!-- 左侧山（虎踞） -->
    <path d="M 0 400 L 200 300 L 300 350 L 400 280 L 0 400" fill="url(#mountainGrad)" stroke="#5A6B8B" stroke-width="2"/>
    <path d="M 200 300 Q 250 250 300 300" stroke="#4A5B7B" stroke-width="2" fill="none" opacity="0.6"/>
    <!-- 右侧山（龙盘） -->
    <path d="M 400 280 L 500 250 L 600 270 L 700 220 L 800 240 L 800 400 L 400 400 Z" 
          fill="url(#mountainGrad)" stroke="#5A6B8B" stroke-width="2"/>
    <path d="M 500 250 Q 550 200 600 250" stroke="#4A5B7B" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- 虎的剪影（虎踞） -->
  <g transform="translate(250, 320)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="40" ry="25" fill="#8B7355"/>
    <ellipse cx="-25" cy="-10" rx="15" ry="20" fill="#8B7355"/>
    <ellipse cx="25" cy="-10" rx="15" ry="20" fill="#8B7355"/>
    <circle cx="-10" cy="-5" r="3" fill="#4A4A4A"/>
    <circle cx="10" cy="-5" r="3" fill="#4A4A4A"/>
    <path d="M -5 5 Q 0 10 5 5" stroke="#654321" stroke-width="2" fill="none"/>
    <!-- 尾巴 -->
    <path d="M -30 0 Q -40 -10 -35 -20" stroke="#8B7355" stroke-width="4" fill="none"/>
  </g>
  
  <!-- 龙的剪影（龙盘） -->
  <g transform="translate(550, 240)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="50" ry="15" fill="#6B7D9B" transform="rotate(-20 0 0)"/>
    <ellipse cx="30" cy="5" rx="25" ry="12" fill="#6B7D9B" transform="rotate(-15 30 5)"/>
    <ellipse cx="60" cy="10" rx="20" ry="10" fill="#6B7D9B" transform="rotate(-10 60 10)"/>
    <circle cx="10" cy="-5" r="4" fill="#4A4A4A"/>
    <!-- 龙角 -->
    <path d="M 5 -10 L 0 -20 L 5 -15" stroke="#6B7D9B" stroke-width="2" fill="none"/>
    <path d="M 15 -10 L 20 -20 L 15 -15" stroke="#6B7D9B" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 春日景象（年年春日犹不及） -->
  <g opacity="0.7">
    <!-- 花朵 -->
    <ellipse cx="300" cy="380" rx="8" ry="12" fill="#FFB6C1" transform="rotate(-20 300 380)"/>
    <ellipse cx="320" cy="390" rx="6" ry="10" fill="#FFC0CB" transform="rotate(15 320 390)"/>
    <ellipse cx="500" cy="400" rx="7" ry="11" fill="#FFB6C1" transform="rotate(-10 500 400)"/>
    <ellipse cx="600" cy="410" rx="5" ry="9" fill="#FFC0CB" transform="rotate(20 600 410)"/>
    <!-- 新绿 -->
    <ellipse cx="350" cy="420" rx="15" ry="8" fill="#90EE90" transform="rotate(-15 350 420)"/>
    <ellipse cx="550" cy="430" rx="12" ry="7" fill="#98FB98" transform="rotate(10 550 430)"/>
  </g>
  
  <!-- 追忆的符号（大梦成空存追忆） -->
  <g transform="translate(400, 200)" opacity="0.4">
    <!-- 破碎的梦 -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="#C0C0C0" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#C0C0C0" stroke-width="2"/>
    <line x1="20" y1="-20" x2="-20" y2="20" stroke="#C0C0C0" stroke-width="2"/>
    <!-- 记忆的碎片 -->
    <circle cx="-15" cy="10" r="3" fill="#FFD700" opacity="0.6"/>
    <circle cx="15" cy="-10" r="2.5" fill="#FFD700" opacity="0.6"/>
    <circle cx="10" cy="15" r="2" fill="#FFD700" opacity="0.6"/>
  </g>
  
  <!-- 文字 -->
  <text x="400" y="570" font-family="serif" font-size="18" fill="#4A5568" 
        text-anchor="middle" opacity="0.8">虎踞龙盘</text>
</svg>
