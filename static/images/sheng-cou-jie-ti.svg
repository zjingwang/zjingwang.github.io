<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D0D0D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8B8B8;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#C0C0C0" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- 单调背景 -->
  <rect width="800" height="600" fill="url(#monoGrad)"/>
  <rect width="800" height="600" fill="url(#gridPattern)"/>
  
  <!-- 循环的阶梯（重复的"一如既往"） -->
  <g transform="translate(400, 300)">
    <!-- 阶梯1 -->
    <rect x="-200" y="-100" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="-150" y="-80" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="-100" y="-60" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="-50" y="-40" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="0" y="-20" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="50" y="0" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="100" y="20" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    <rect x="150" y="40" width="50" height="20" fill="#A0A0A0" opacity="0.7"/>
    
    <!-- 循环回到起点（箭头表示循环） -->
    <path d="M 200 60 Q 250 80 200 100 L 180 95 L 190 100 L 180 105 Z" 
          fill="#808080" opacity="0.6"/>
    <path d="M 200 100 Q 150 120 100 140 Q 50 160 0 180 Q -50 200 -100 180 Q -150 160 -200 140 Q -200 120 -200 100" 
          stroke="#808080" stroke-width="3" fill="none" stroke-dasharray="5,3" opacity="0.5"/>
  </g>
  
  <!-- 重复的文字片段（"一如既往地"） -->
  <g opacity="0.5">
    <text x="100" y="150" font-family="serif" font-size="14" fill="#808080" 
          transform="rotate(-10 100 150)">一如既往地</text>
    <text x="300" y="200" font-family="serif" font-size="14" fill="#808080" 
          transform="rotate(5 300 200)">一如既往地</text>
    <text x="500" y="250" font-family="serif" font-size="14" fill="#808080" 
          transform="rotate(-8 500 250)">一如既往地</text>
    <text x="200" y="400" font-family="serif" font-size="14" fill="#808080" 
          transform="rotate(12 200 400)">一如既往地</text>
    <text x="600" y="450" font-family="serif" font-size="14" fill="#808080" 
          transform="rotate(-5 600 450)">一如既往地</text>
  </g>
  
  <!-- 荒谬的元素（散落的问号、感叹号） -->
  <g opacity="0.4">
    <text x="150" y="300" font-family="serif" font-size="30" fill="#A0A0A0">?</text>
    <text x="400" y="350" font-family="serif" font-size="25" fill="#A0A0A0">!</text>
    <text x="600" y="300" font-family="serif" font-size="28" fill="#A0A0A0">?</text>
    <text x="300" y="500" font-family="serif" font-size="22" fill="#A0A0A0">!</text>
  </g>
  
  <!-- 原地等待的人（中心，代表"原地等侯"） -->
  <g transform="translate(400, 300)" opacity="0.6">
    <ellipse cx="0" cy="0" rx="15" ry="18" fill="#808080"/>
    <rect x="-12" y="0" width="24" height="40" fill="#909090" rx="3"/>
    <path d="M -12 40 Q 0 50 12 40" fill="#808080"/>
    <!-- 思考的线条 -->
    <path d="M 20 0 Q 30 -10 40 0 Q 50 10 60 0" stroke="#A0A0A0" stroke-width="2" 
          fill="none" opacity="0.5"/>
  </g>
  
  <!-- 南斗（右上角，代表"隔山望南斗"） -->
  <g transform="translate(700, 100)" opacity="0.5">
    <circle cx="0" cy="0" r="3" fill="#C0C0C0"/>
    <circle cx="15" cy="-5" r="2.5" fill="#C0C0C0"/>
    <circle cx="30" cy="-10" r="2" fill="#C0C0C0"/>
    <circle cx="15" cy="5" r="2.5" fill="#C0C0C0"/>
    <circle cx="30" cy="10" r="2" fill="#C0C0C0"/>
    <circle cx="45" cy="0" r="2" fill="#C0C0C0"/>
    <!-- 连线 -->
    <line x1="0" y1="0" x2="15" y2="-5" stroke="#A0A0A0" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="-5" x2="30" y2="-10" stroke="#A0A0A0" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="5" x2="30" y2="10" stroke="#A0A0A0" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="10" x2="45" y2="0" stroke="#A0A0A0" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 文字 -->
  <text x="400" y="570" font-family="serif" font-size="18" fill="#808080" 
        text-anchor="middle" opacity="0.7">生凑阶梯</text>
</svg>
